<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear el ícono de tu app</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f2f7; color: #000; padding: 24px 16px 48px; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } .caja { background: #1c1c1e !important; } }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .caja { background: #fff; border-radius: 20px; padding: 20px; margin-top: 16px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; opacity: .7; }
  input[type=text] { width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 0; background: rgba(120,120,128,.14); color: inherit; box-sizing: border-box; }
  input[type=color] { width: 64px; height: 44px; border: 0; background: none; padding: 0; }
  .vista { display: flex; gap: 18px; align-items: flex-end; margin-top: 20px; }
  .vista canvas { border-radius: 22.5%; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  button { margin-top: 20px; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: #ff375f; color: #fff; font: 600 17px -apple-system, sans-serif; cursor: pointer; }
  p.nota { font-size: 14px; opacity: .65; }
</style>
</head>
<body>
<main>
  <h1>El ícono de tu app</h1>
  <p class="nota">Es lo que se ve en la pantalla de inicio del teléfono. Escribe una letra o un emoji, elige los colores y descarga los 3 archivos. Guárdalos en la carpeta <strong>icons/</strong> de tu app (reemplaza los que hay).</p>
  <div class="caja">
    <label for="t">Letra o emoji</label>
    <input id="t" type="text" value="H" maxlength="3">
    <div style="display:flex;gap:24px">
      <div><label for="f">Fondo</label><input id="f" type="color" value="#ff375f"></div>
      <div><label for="c">Letra</label><input id="c" type="color" value="#ffffff"></div>
      <div><label for="f2">Degradado</label><input id="f2" type="color" value="#ff9f0a"></div>
    </div>
    <div class="vista"><canvas id="v" width="120" height="120"></canvas><canvas id="v2" width="60" height="60"></canvas></div>
    <button id="d">Descargar los 3 íconos</button>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function dibujar(canvas, size) {
    const g = canvas.getContext('2d'); canvas.width = size; canvas.height = size;
    const grad = g.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, $('f').value); grad.addColorStop(1, $('f2').value);
    g.fillStyle = grad; g.fillRect(0, 0, size, size);
    g.fillStyle = $('c').value; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `800 ${size * 0.52}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif`;
    g.fillText($('t').value || ' ', size / 2, size * 0.53);
  }
  function vista() { dibujar($('v'), 120); dibujar($('v2'), 60); $('v').style.width = '120px'; $('v2').style.width = '60px'; }
  ['t', 'f', 'c', 'f2'].forEach((id) => $(id).addEventListener('input', vista)); vista();
  $('d').onclick = () => {
    [['icon-512.png', 512], ['icon-192.png', 192], ['apple-touch-icon.png', 180]].forEach(([nombre, size], i) => {
      const c = document.createElement('canvas'); dibujar(c, size);
      setTimeout(() => { const a = document.createElement('a'); a.download = nombre; a.href = c.toDataURL('image/png'); a.click(); }, i * 300);
    });
  };
</script>
</body>
</html>
